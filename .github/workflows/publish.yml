name: Publish

# Every merge to main publishes ghcr.io/<owner>/uos-docker:
#   first build of a UniFi OS version   -> <version>            (e.g. 5.1.42)
#   each later merge on that version    -> <version>-<n>        (5.1.42-1, 5.1.42-2, ...)
# plus `latest`, and a git tag + GitHub release with the same name. The base uosserver image is extracted first if this version is new.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialised so two quick merges cannot compute the same patch level.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write      # create the git tag + GitHub release
  packages: write

jobs:
  base:
    uses: ./.github/workflows/uosserver.yml

  publish:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: tag
        run: |
          set -euo pipefail
          . ./uos-version.env
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/uos-docker"
          tag=$(./.github/scripts/next-tag.sh "$image" "$UOS_VERSION")
          echo "version=$UOS_VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $image:$tag"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: UOS_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=uos-docker
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ steps.tag.outputs.image }}
          UOS_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "UniFi OS Server **$UOS_VERSION**. Image: \`$IMAGE:$TAG\`" \
            --latest
