name: Checks

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck
        run: shellcheck docker-entrypoint.sh .github/scripts/*.sh
      - name: uos-version.env is well formed
        run: |
          set -euo pipefail
          . ./uos-version.env
          [[ $UOS_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          for a in AMD64 ARM64; do
            u=UOS_${a}_URL; s=UOS_${a}_SHA256
            [[ ${!u} == https://fw-download.ubnt.com/* ]]
            [[ ${!s} =~ ^[0-9a-f]{64}$ ]]
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Does the base image exist yet?
        id: base
        run: |
          . ./uos-version.env
          echo "version=$UOS_VERSION" >> "$GITHUB_OUTPUT"
          # A version-bump PR cannot build: its base image is only extracted after merge.
          if docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/uosserver:$UOS_VERSION" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::uosserver:$UOS_VERSION is not published yet; skipping the image build (it is extracted on merge)."
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.base.outputs.present == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: UOS_VERSION=${{ steps.base.outputs.version }}
